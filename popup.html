<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="popup.css">
<header>
  <img src="icons/icon48.png" width="28" height="28" alt="">
  <h1>Sanal Kamera</h1>
  <span id="status" class="status"><i></i><span id="statusText">Kamera</span></span>
</header>

<div class="seg" id="seg">
  <button data-mode="camera">📷 Kamera</button>
  <button data-mode="video">🎞 Video</button>
</div>

<section>
  <div class="row">
    <h2>Videolar</h2>
    <div class="actions">
      <label class="btn small" for="file">＋ Ekle</label>
      <input type="file" id="file" accept="video/*" hidden>
    </div>
  </div>
  <div class="recrow">
    <button class="btn small rec" data-rec="camera">⏺ Kamera</button>
    <button class="btn small rec" data-rec="screen">🖥 Ekran + ses</button>
    <button class="btn small rec" data-rec="audio">🎙 Ses</button>
  </div>
  <ul id="list"></ul>
  <p id="empty" class="muted" hidden>Henüz video yok. Bir dosya ekle ya da kamera kaydı al.</p>
</section>

<section>
  <div class="row"><h2>Efektler</h2><button id="reset" class="btn small ghost">Sıfırla</button></div>
  <label class="fx">
    <span>Ayna (sağ-sol çevir)</span>
    <input type="checkbox" id="mirror" class="switch">
  </label>
  <label class="fx">
    <span>Parlaklık</span>
    <input type="range" id="brightness" min="0.5" max="1.5" step="0.05">
    <output id="brightnessOut"></output>
  </label>
  <label class="fx">
    <span>Bulanıklık</span>
    <input type="range" id="blur" min="0" max="10" step="0.5">
    <output id="blurOut"></output>
  </label>
  <p class="muted tiny">Efektler video kaynağına uygulanır.</p>
</section>

<footer>
  <span><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>V</kbd> Kamera/Video geçişi</span>
  <a href="#" id="shortcuts">değiştir</a>
</footer>

<script src="lib.js"></script>
<script src="popup.js"></script>
