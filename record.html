<!doctype html>
<meta charset="utf-8">
<title data-i18n="recTitle">Recording</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="record.css">
<main>
  <header>
    <img src="icons/icon48.png" width="32" height="32" alt="">
    <h1 data-i18n="recTitle"></h1>
  </header>

  <div class="tabs" id="tabs">
    <button data-src="camera" class="on" data-i18n="tabCamera"></button>
    <button data-src="screen" data-i18n="screenAudio"></button>
    <button data-src="audio" data-i18n="audioOnly"></button>
  </div>

  <div class="stage">
    <video id="v" autoplay muted playsinline></video>
    <div id="placeholder" class="placeholder" hidden></div>
    <div id="count" class="overlay" hidden></div>
    <div id="timer" class="pill" hidden><i></i><span id="time">00:00</span></div>
  </div>

  <div id="msg" class="msg"></div>
  <div id="hint" class="hint" hidden></div>

  <div id="controls">
    <input id="name" type="text" data-i18n-ph="namePh" maxlength="60">
    <div class="btns">
      <button id="rec" class="btn primary big" data-i18n="startRec"></button>
      <button id="stop" class="btn big" hidden data-i18n="stopSave"></button>
      <button id="close" class="btn ghost big" data-i18n="close"></button>
    </div>
  </div>

  <div id="done" hidden>
    <div class="btns">
      <button id="dl" class="btn big" data-i18n="dlBtn"></button>
      <button id="again" class="btn big" data-i18n="newRec"></button>
      <button id="close2" class="btn primary big" data-i18n="done"></button>
    </div>
  </div>
</main>
<script src="lib.js"></script>
<script src="record.js"></script>
