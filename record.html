<!doctype html>
<meta charset="utf-8">
<title>Kayıt</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="record.css">
<main>
  <header>
    <img src="icons/icon48.png" width="32" height="32" alt="">
    <h1>Kayıt</h1>
  </header>

  <div class="tabs" id="tabs">
    <button data-src="camera" class="on">📷 Kamera</button>
    <button data-src="screen">🖥 Ekran + ses</button>
    <button data-src="audio">🎙 Sadece ses</button>
  </div>

  <div class="stage">
    <video id="v" autoplay muted playsinline></video>
    <div id="placeholder" class="placeholder" hidden></div>
    <div id="count" class="overlay" hidden></div>
    <div id="timer" class="pill" hidden><i></i><span id="time">00:00</span></div>
  </div>

  <div id="msg" class="msg"></div>
  <div id="hint" class="hint" hidden></div>

  <div id="controls">
    <input id="name" type="text" placeholder="Kayıt adı (boş bırakırsan tarih/saat)" maxlength="60">
    <div class="btns">
      <button id="rec" class="btn primary big">⏺ Kaydı başlat</button>
      <button id="stop" class="btn big" hidden>⏹ Durdur ve kaydet</button>
      <button id="close" class="btn ghost big">✕ Kapat</button>
    </div>
  </div>

  <div id="done" hidden>
    <div class="btns">
      <button id="dl" class="btn big">⬇ İndir</button>
      <button id="again" class="btn big">⏺ Yeni kayıt</button>
      <button id="close2" class="btn primary big">✓ Kapat</button>
    </div>
  </div>
</main>
<script src="lib.js"></script>
<script src="record.js"></script>
